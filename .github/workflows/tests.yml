# Deterministic checks for every pull request and push to main. Nothing
# here calls a real LLM or needs a secret: the AI provider is faked at the
# HTTP seam. AI quality is measured separately in ai-evals.yml.
name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: pytest (unit, API, workflow)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # Two steps on purpose -- see the note in requirements-dev.txt.
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest --cov=app --cov-report=term --cov-report=xml --junitxml=pytest-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: |
            backend/pytest-junit.xml
            backend/coverage.xml

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: type-check and build
        run: npm run build
      - name: lint (reported, not yet blocking -- src/ has pre-existing findings)
        run: npm run lint
        continue-on-error: true

  e2e:
    name: Playwright (fake AI provider)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright
        run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
