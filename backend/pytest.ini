[pytest]
# `pytest` on its own runs the deterministic suites only (no network, no
# LLM, throwaway SQLite). The AI evaluation suite is opt-in by path:
#     pytest tests/evals -v
# The legacy standalone scripts (backend/test_*.py) are run directly with
# `python test_xxx.py` and are deliberately not collected here.
testpaths = tests/unit tests/api tests/workflow
pythonpath = .
addopts = -ra --strict-markers
markers =
    live_llm: calls a real LLM provider (tests/evals only)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
