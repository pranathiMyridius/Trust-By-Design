# Alembic config. The database URL is NOT set here -- alembic/env.py uses
# the app's own engine (app/database.py), which reads DATABASE_URL from
# backend/.env, so migrations always hit the same database as the app.
#
# Migrations run automatically on app start (app/migrations.py). To create
# a new one after changing a model, from backend/ with the venv active:
#     alembic revision --autogenerate -m "describe the change"
# then review the generated file in alembic/versions/.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
