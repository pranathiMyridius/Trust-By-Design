# Render Blueprint: creates the web service (from ./Dockerfile) and a
# Postgres database, and wires DATABASE_URL between them.
# Render dashboard > New > Blueprint > pick this repository.
# Values marked `sync: false` are asked for when the Blueprint is created.
services:
  - type: web
    name: risk-assessment-workbench
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: risk-assessment-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Migration guard (app/migrations.py): the app will not migrate this
      # remote database unless MIGRATION_AUTHORIZED_HOST names its host.
      # Set it in the dashboard for a deploy that needs a migration, and
      # clear it afterwards.
      - key: MIGRATION_AUTHORIZED_HOST
        sync: false
      # Generate locally with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: FILE_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      # AI provider (backend/app/ai/provider.py): OpenAI. Set the key in the
      # Render dashboard; never in this file.
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      # Only used with LLM_PROVIDER=openrouter.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      # Render already redirects http -> https at its edge; enabling this
      # too would redirect Render's own (plain-http) health checks.
      - key: FORCE_HTTPS
        value: "false"
      # The free plan has no persistent disk, so on-disk backups would be
      # lost anyway; use the database provider's backups instead.
      - key: BACKUP_INTERVAL_HOURS
        value: "0"
      - key: AI_MASK_SENSITIVE_DATA
        value: "true"

databases:
  - name: risk-assessment-db
    plan: free
    databaseName: risk_assessment
